<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Google Meet External Bridge</title>
  <style>
    body {
      width: 260px;
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #202124;
      color: #ffffff;
    }
    h2 {
      margin: 0 0 8px 0;
      font-size: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    p {
      margin: 4px 0;
      font-size: 13px;
      color: #9aa0a6;
    }
    .status-badge {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: bold;
      background-color: #303134;
      color: #8ab4f8;
      margin-top: 8px;
    }
    .footer {
      margin-top: 12px;
      font-size: 11px;
      color: #5f6368;
      border-top: 1px solid #3c4043;
      padding-top: 8px;
    }
  </style>
</head>
<body>
  <h2><span>🎙️</span> Meet Bridge v1.1</h2>
  <p>Conecta pestañas de Meet con el concentrador local en <code>ws://127.0.0.1:8765</code>.</p>
  <div class="status-badge" id="status-badge">Modo pasivo / Activo en meet.google.com</div>
  <div class="footer">meet-tools • Control bidireccional</div>
</body>
</html>
